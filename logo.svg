<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 90" width="100%" height="100%" fill="none">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B" />
      <stop offset="35%" stop-color="#F3E5AB" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7A1E" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5E6B3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#E2BC5C" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Monogram Group (SB) -->
  <g filter="url(#subtleGlow)" transform="translate(10, 8)">
    <!-- S Ribbon Path -->
    <path d="M42 12 C32 12, 18 18, 18 30 C18 42, 34 46, 38 52 C42 58, 40 64, 30 64 C20 64, 14 56, 12 50 L4 54 C8 64, 18 72, 32 72 C46 72, 54 62, 54 50 C54 36, 36 32, 32 26 C28 20, 32 18, 38 18 C46 18, 50 24, 52 28 L60 22 C56 16, 50 12, 42 12 Z" 
          fill="url(#goldRibbon)" stroke="#AA7A1E" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- S Inner Bevel Highlight -->
    <path d="M38 16 C30 16, 22 20, 22 28 C22 36, 34 40, 38 46 C42 52, 42 58, 34 60 C26 60, 18 54, 16 48" 
          fill="none" stroke="#FFF3CC" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

    <!-- B Ribbon Path -->
    <path d="M68 14 L68 70 L92 70 C106 70, 114 62, 114 52 C114 44, 108 38, 98 36 C106 34, 110 28, 110 22 C110 14, 102 14, 90 14 Z M78 22 L88 22 C96 22, 100 24, 100 30 C100 36, 94 38, 86 38 L78 38 Z M78 46 L88 46 C98 46, 104 48, 104 56 C104 62, 98 62, 88 62 L78 62 Z" 
          fill="url(#goldRibbon)" stroke="#AA7A1E" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- B Inner Bevel Highlight -->
    <path d="M72 16 L72 68 M80 24 L86 24 C92 24, 96 26, 96 29 M80 48 L88 48 C94 48, 98 50, 98 54" 
          fill="none" stroke="#FFF3CC" stroke-width="1.2" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(145, 42)">
    <!-- Primary Brand Wordmark -->
    <text font-family="'Cinzel', 'Playfair Display', 'Merriweather', serif" 
          font-size="34" 
          font-weight="600" 
          letter-spacing="0.04em" 
          fill="url(#goldText)">The Sales Bench</text>
    
    <!-- Tagline -->
    <text y="24" 
          font-family="'Inter', 'Montserrat', sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="0.22em" 
          fill="#D4AF37" 
          opacity="0.95">REVENUE ARCHITECTED</text>
  </g>
</svg>
